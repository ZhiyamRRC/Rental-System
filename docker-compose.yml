# Production stack: Next.js app + MySQL.
#
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up -d --build
#
# App:    http://localhost:3000
# Admin:  http://localhost:3000/admin

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
    volumes:
      - db_data:/var/lib/mysql
    # Not published by default — the app reaches it over the compose network.
    # Uncomment to inspect with a local client:
    # ports:
    #   - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Set to "webpack" if your build machine is memory constrained.
        NEXT_BUILD_BUNDLER: ${NEXT_BUILD_BUNDLER:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ---- database (MYSQL_URL wins over DATABASE_URL) ----
      MYSQL_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/${MYSQL_DATABASE:-app_db}
      DB_SSL: "false"
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      # ---- first admin account (only used when admin_users is empty) ----
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # ---- optional: booking notifications over WhatsApp Cloud API ----
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_ADMIN_TO: ${WHATSAPP_ADMIN_TO:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_CONFIRMED: ${WHATSAPP_TEMPLATE_CONFIRMED:-}
      WHATSAPP_TEMPLATE_DECLINED: ${WHATSAPP_TEMPLATE_DECLINED:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      # ---- optional: skip next/image optimisation on tiny hosts ----
      NEXT_IMAGES_UNOPTIMIZED: ${NEXT_IMAGES_UNOPTIMIZED:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Admin uploads persist across rebuilds. public/img ships in the image.
      - uploads:/app/public/uploads

  # Optional: apply Drizzle SQL migrations explicitly (has drizzle-kit).
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/${MYSQL_DATABASE:-app_db}

volumes:
  db_data:
  uploads:
