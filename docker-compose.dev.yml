# Development stack with hot reload.
#
#   docker compose -f docker-compose.dev.yml up
#
# Source is bind-mounted, so edits refresh instantly. node_modules stays in a
# container volume so host/linux binaries (sharp, SWC) never clash.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      MYSQL_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/${MYSQL_DATABASE:-app_db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    command: >-
      sh -c "npm install &&
             node scripts/wait-for-db.js &&
             ./node_modules/.bin/tsx scripts/seed.ts || true &&
             npm run dev -- --port 3000 --hostname 0.0.0.0"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next

volumes:
  db_dev_data:
  node_modules_dev:
  next_cache_dev:
